# NieR Remastered - DXVK settings for NieR:Automata (Vulkan renderer)
# Let the driver pick the present mode; vsync is still controlled from the game menu
dxgi.tearFree = Auto

# DLSS (DLAA, native resolution). Set the game's Anti-Aliasing to Off.
# This loads DLSS support; turn it on/off and pick the preset in the in-game menu (Page Up),
# which saves your choice to nier_mod.ini. Preset: 0 = default, 10 = J, 11 = K, 12 = L, 13 = M
dxvk.nierDlss = True
dxvk.nierDlssPreset = 12

# Developer tools, keep off
# Frame tracer (F9 captures a frame into nier_trace\)
d3d11.nierTrace = False
# Experimental ray traced AO, can hang the GPU
d3d11.nierRt = False
d3d11.nierRtao = 0
